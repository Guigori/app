crons:
  - name: finnos-reminders
    description: "Avisa cada usuário sobre contas e faturas chegando no vencimento, no horário que ele escolheu"
    cron: "0 * * * *"
    timezone: "America/Sao_Paulo"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/reminders"
    method: POST
    enabled: true
