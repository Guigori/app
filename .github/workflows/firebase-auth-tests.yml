name: FINNOS Firebase Auth Tests

on:
  push:
    branches: [feat/firebase-fastapi-migration-20261012]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/lib/firebase.py"
      - "backend/lib/firebase_auth.py"
      - "backend/tests/test_firebase_auth.py"
      - "backend/tests/test_firestore_transactions.py"
      - "backend/tests/test_firestore_http.py"
      - "backend/tests/test_firebase_diagnostics.py"
      - "backend/routers/firebase_diagnostics.py"
      - "backend/routers/firebase_transactions.py"
      - "backend/server.py"
      - "backend/tests/test_vercel_firebase_session.py"
      - "backend/tests/test_*firestore*.py"
      - "backend/tests/test_invoice_payments.py"
      - "backend/tests/test_preview_project_isolation.py"
      - "backend/tests/test_finance_migration_plan.py"
      - "backend/tests/test_encrypted_backup.py"
      - "backend/tests/test_firebase_backup_recovery.py"
      - "backend/tests/test_configure_test_users.py"
      - "backend/scripts/**"
      - "frontend/finnos/**"
      - "frontend/api/**"
      - "frontend/requirements.txt"
      - "frontend/vercel.json"
      - ".github/workflows/firebase-auth-tests.yml"

permissions:
  contents: read

jobs:
  firebase-auth:
    name: Backend · Firebase authentication tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10" "pytest-xdist>=3.6.0" "pytest-asyncio>=0.24.0" -r frontend/requirements.txt
      - name: Run Firebase authentication contract tests
        env:
          PYTHONPATH: frontend:backend
        run: python -m pytest backend/tests/test_firebase_auth.py backend/tests/test_firestore_transactions.py backend/tests/test_firestore_http.py backend/tests/test_firebase_diagnostics.py backend/tests/test_vercel_firebase_session.py backend/tests/test_firestore_finance.py backend/tests/test_firestore_cards.py backend/tests/test_invoice_payments.py backend/tests/test_firestore_invoice_flow.py backend/tests/test_firestore_budgets.py backend/tests/test_firestore_goals_radar.py backend/tests/test_firestore_sync_conflicts.py backend/tests/test_preview_project_isolation.py backend/tests/test_finance_migration_plan.py backend/tests/test_encrypted_backup.py backend/tests/test_firebase_backup_recovery.py backend/tests/test_configure_test_users.py backend/tests/test_import_firestore_demo.py -v
