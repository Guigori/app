name: FINNOS Firebase Auth Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/lib/firebase.py"
      - "backend/lib/firebase_auth.py"
      - "backend/tests/test_firebase_auth.py"
      - "backend/tests/test_firestore_transactions.py"
      - "backend/tests/test_firestore_http.py"
      - "backend/routers/firebase_transactions.py"
      - "backend/server.py"
      - ".github/workflows/firebase-auth-tests.yml"

permissions:
  contents: read

jobs:
  firebase-auth:
    name: Backend · Firebase authentication tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10" "pytest-xdist>=3.6.0" "pytest-asyncio>=0.24.0" "fastapi==0.141.1" "firebase-admin>=6.5.0"
      - name: Run Firebase authentication contract tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_firebase_auth.py backend/tests/test_firestore_transactions.py backend/tests/test_firestore_http.py -v
