name: FINNOS UI E2E

on:
  push:
    branches: [refactor/finn-migration-phase1-20261026]
    paths:
      - "frontend/src/**"
      - "tests/e2e/**"
      - "tests/playwright.config.ts"
      - "docs/finance/LOTE-P0-P1-20261028.md"
      - ".github/workflows/onboarding-e2e.yml"
  pull_request:
    branches: [main]
    # AUD-16: same coverage as push; screens depend on data.ts, sync and the API.
    paths:
      - "frontend/src/**"
      - "frontend/finnos/**"
      - "frontend/api/**"
      - "frontend/fixtures/**"
      - "frontend/vercel.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "tests/**"
      - ".github/workflows/onboarding-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding:
    name: Desktop and mobile onboarding and wallet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Playwright dependencies
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start frontend in device-only mode
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/finnos-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/finnos-vite.log
          exit 1
      - name: Run onboarding and wallet end-to-end tests
        working-directory: tests
        run: npx playwright test --project=desktop --project=mobile
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finnos-ui-desktop-mobile
          path: tests/test-results/
          if-no-files-found: ignore
          retention-days: 7
