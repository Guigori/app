name: Graphify Architecture Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'app/**'
      - 'src/**'
      - 'api/**'
      - '.github/workflows/graphify.yml'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Graphify package
        run: |
          python -m pip install --disable-pip-version-check graphifyy
          graphify --version

      - name: Extract code graph (no AI tokens)
        env:
          GRAPHIFY_QUERY_LOG_DISABLE: '1'
        run: |
          graphify extract . --code-only
          test -s graphify-out/graph.json

      - name: Summarize graph output
        if: success()
        run: |
          echo "## FINNOS Graphify" >> "$GITHUB_STEP_SUMMARY"
          echo "Static code graph generated successfully." >> "$GITHUB_STEP_SUMMARY"
          find graphify-out -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Upload architecture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finnos-graphify-architecture
          path: graphify-out/
          if-no-files-found: warn
          retention-days: 7
