name: FINNOS · Shadow Finance Emulator

on:
  push:
    branches:
      - 'refactor/finn-migration-*'
    paths:
      - 'frontend/finnos/**'
      - '.github/workflows/finance-shadow-emulator.yml'
      - '.github/workflows/firestore-adapter-tests.yml'
      - 'docs/finance/LOTE-P0-P1-20261028.md'
      - '.github/test-fixtures/firebase.shadow.json'
      - '.github/test-fixtures/firestore.shadow.rules'
      - 'docs/finance/SHADOW-EMULATOR-GATE-20261027.md'
  pull_request:
    paths:
      - 'frontend/src/lib/mirror.ts'
      - 'frontend/src/lib/mirror.parity.test.ts'
      - 'frontend/src/lib/local/**'
      - 'frontend/finnos/**'
      - '.github/workflows/finance-shadow-emulator.yml'
      - '.github/workflows/firestore-adapter-tests.yml'
      - 'docs/finance/LOTE-P0-P1-20261028.md'
      - '.github/test-fixtures/firebase.shadow.json'
      - '.github/test-fixtures/firestore.shadow.rules'
      - 'docs/finance/SHADOW-EMULATOR-GATE-20261027.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: frontend
      FIREBASE_PROJECT_ID: demo-finnos
      FINNOS_SHADOW_OUTBOX_MODE: emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: |
          python -m pip install -r frontend/requirements.txt pytest httpx
      - name: Install Firestore emulator CLI (ephemeral CI only)
        run: npm install --global firebase-tools
      - name: Firestore demo project and independent shadow reconciliation
        run: |
          firebase emulators:exec \
            --project demo-finnos \
            --config .github/test-fixtures/firebase.shadow.json \
            --only firestore \
            'FIRESTORE_EMULATOR_HOST=127.0.0.1:8089 SHADOW_FIXTURES=$RUNNER_TEMP/shadow python -m pytest -q frontend/finnos/tests/test_finance_shadow_emulator_live.py frontend/finnos/tests/test_finance_shadow_emulator_routes.py frontend/finnos/tests/test_backup_restore_emulator.py frontend/finnos/tests/test_tx_pack_emulator.py frontend/finnos/tests/test_reads_baseline_emulator.py -s'
      - name: Device copy parity (local engine against the server's answers)
        if: always()
        working-directory: frontend
        run: |
          if [ ! -f "$RUNNER_TEMP/shadow/mirror.json" ]; then echo "Sem fixtures de paridade."; exit 1; fi
          npm ci --no-audit --no-fund
          SHADOW_FIXTURES=$RUNNER_TEMP/shadow npx vitest run src/lib/mirror.parity.test.ts
