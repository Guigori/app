name: FINNOS · Shadow Finance Emulator

on:
  push:
    branches:
      - 'refactor/finn-migration-*'
    paths:
      - 'frontend/finnos/**'
      - '.github/workflows/finance-shadow-emulator.yml'
      - '.github/test-fixtures/firebase.shadow.json'
      - '.github/test-fixtures/firestore.shadow.rules'
      - 'docs/finance/SHADOW-EMULATOR-GATE-20261027.md'
  pull_request:
    paths:
      - 'frontend/finnos/**'
      - '.github/workflows/finance-shadow-emulator.yml'
      - '.github/test-fixtures/firebase.shadow.json'
      - '.github/test-fixtures/firestore.shadow.rules'
      - 'docs/finance/SHADOW-EMULATOR-GATE-20261027.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: frontend
      FIREBASE_PROJECT_ID: demo-finnos
      FINNOS_SHADOW_OUTBOX_MODE: emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: |
          python -m pip install -r frontend/requirements.txt pytest httpx
      - name: Install Firestore emulator CLI (ephemeral CI only)
        run: npm install --global firebase-tools
      - name: Firestore demo project and independent shadow reconciliation
        run: |
          firebase emulators:exec \
            --project demo-finnos \
            --config .github/test-fixtures/firebase.shadow.json \
            --only firestore \
            'FIRESTORE_EMULATOR_HOST=127.0.0.1:8089 python -m pytest -q frontend/finnos/tests/test_finance_shadow_emulator_live.py'
