name: FINNOS · Regressões financeiras

on:
  push:
    branches:
      - 'refactor/finn-migration-*'
  pull_request:
    paths:
      - 'frontend/finnos/**'
      - 'frontend/src/lib/local/**'
      - '.github/workflows/finance-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Save generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finnos-frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: warn

  active-financial-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install active API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt pytest pytest-asyncio httpx email-validator requests pywebpush
      - name: Syntax check
        run: python -m compileall -q frontend/finnos
      - name: Run active API tests including finance regressions
        env:
          PYTHONPATH: frontend
        run: python -m pytest -q frontend/finnos/tests
