name: FINNOS CI

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: finnos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name != 'schedule'
    name: Frontend · typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  backend:
    if: github.event_name != 'schedule'
    name: Backend · Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Validate changed backend imports
        run: python -m py_compile backend/routers/transactions.py


  notifications:
    if: github.event_name == 'schedule'
    name: Notifications · hourly dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger FINNOS notification dispatcher
        env:
          FINNOS_CRON_SECRET: ${{ secrets.FINNOS_CRON_SECRET }}
        run: |
          if [ -z "$FINNOS_CRON_SECRET" ]; then
            echo "FINNOS_CRON_SECRET is not configured; dispatcher skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Cron-Secret: $FINNOS_CRON_SECRET" \
            https://finnos.vercel.app/api/push/dispatch
