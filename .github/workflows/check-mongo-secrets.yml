name: FINNOS · Conferir MongoDB (temporário, somente leitura)

# Temporary check for PR #133: are the MongoDB secrets set in GitHub, can GitHub reach the cluster, and which
# databases exist? Read-only: lists database and collection names with document counts. Prints no data, no
# connection string, writes nothing. Remove after the check.
on:
  pull_request:
    paths:
      - '.github/workflows/check-mongo-secrets.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pymongo[srv]==4.10.1"
      - name: Check (read-only)
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          CRON: ${{ secrets.FINNOS_CRON_SECRET }}
        run: |
          python - <<'EOF'
          import os
          print("MONGO_URL configurado:", bool(os.getenv("MONGO_URL")))
          print("DB_NAME configurado:", bool(os.getenv("DB_NAME")))
          print("FINNOS_CRON_SECRET configurado:", bool(os.getenv("CRON")))
          if not os.getenv("MONGO_URL"):
              raise SystemExit(0)
          from pymongo import MongoClient
          try:
              client = MongoClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=15000)
              names = client.list_database_names()
          except Exception as exc:
              print("Conexão falhou:", type(exc).__name__, str(exc)[:200].replace(os.environ["MONGO_URL"], "<url>"))
              raise SystemExit(0)
          historical = os.getenv("DB_NAME")
          for name in names:
              if name in ("admin", "local", "config"):
                  continue
              mark = " (DB_NAME, histórico)" if name == historical else ""
              print(f"Banco {name}{mark}:")
              for coll in sorted(client[name].list_collection_names()):
                  print(f"  {coll}: {client[name][coll].estimated_document_count()} documentos")
          EOF
